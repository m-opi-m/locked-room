<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>غرفة مقفولة</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main id="home" class="screen">
  <h1>غرفة مقفولة</h1>
  <p class="lead">محادثة بين اتنين بس. الرسايل والصور بتتشفر على جهازك قبل ما تتبعت، والسيرفر مبيشوفش غير حروف مش مفهومة.</p>

  <section class="card">
    <button id="create" class="primary">إنشاء غرفة جديدة</button>
    <div id="created" class="hidden">
      <p>ابعت الكود ده للشخص التاني بطريقة آمنة، وادخل الغرفة.</p>
      <div id="codeBox" class="codebox" dir="ltr"></div>
      <div class="row">
        <button id="copyCode">نسخ الكود</button>
        <button id="copyLink">نسخ الرابط</button>
        <button id="enter" class="primary">دخول الغرفة</button>
      </div>
    </div>
  </section>

  <section class="card">
    <label for="codeIn">معايا كود</label>
    <input id="codeIn" dir="ltr" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX">
    <button id="join" class="primary">دخول</button>
  </section>
  <p id="homeErr" class="err" role="alert"></p>
</main>

<main id="chat" class="screen hidden">
  <header>
    <div>
      <strong>غرفة مقفولة</strong>
      <span id="status" class="status">بيتصل...</span>
    </div>
    <button id="leave">إنهاء ومسح</button>
  </header>
  <div id="log" class="log" aria-live="polite"></div>
  <div class="composer">
    <button id="attach" aria-label="إرسال صورة">صورة</button>
    <input id="file" type="file" accept="image/*" class="hidden">
    <input id="msg" autocomplete="off" placeholder="اكتب رسالة" maxlength="4000">
    <button id="sendBtn" class="primary">إرسال</button>
  </div>
</main>
<script src="/app.js"></script>
</body>
</html>
