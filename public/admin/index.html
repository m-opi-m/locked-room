<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#07142a"><meta name="color-scheme" content="dark"><title>أدمن · غرفة مقفولة</title><link rel="icon" type="image/png" href="/app-icon.png"><link rel="stylesheet" href="/admin.css?v=1.26.0"></head><body><main><header><h1>وضع الأدمن</h1><span id="ver" class="muted"></span></header><section id="login" class="card" hidden><p class="muted">اكتب الرقم السري للأدمن.</p><input id="pw" type="password" autocomplete="off" placeholder="الرقم السري"><button id="go" class="primary">دخول</button><p id="loginErr" class="err"></p><div class="acts"><button id="forgot">نسيت الرقم / أول مرة؟ ابعت كود على الإيميل</button><button id="back1">رجوع للتطبيق</button></div></section><section id="reset" class="card" hidden><h2>تغيير الرقم السري</h2><p class="muted">هيتبعت كود (6 أرقام) على إيميلك. اكتبه هنا واختار رقم سري جديد (8 حروف على الأقل).</p><button id="send">ابعت الكود على الإيميل</button><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="الكود" dir="ltr"><input id="npw" type="password" autocomplete="new-password" placeholder="الرقم السري الجديد"><input id="npw2" type="password" autocomplete="new-password" placeholder="اكتبه تاني"><button id="save" class="primary">حفظ الرقم الجديد</button><p id="resetMsg" class="err"></p><button id="cancelReset">إلغاء</button></section><section id="panel" hidden><div class="bar"><input id="q" type="search" placeholder="ابحث بأول حروف كود الغرفة"><button id="refresh">تحديث</button><label class="chk"><input id="auto" type="checkbox"> تلقائي</label><button id="chpw">تغيير الرقم السري</button><button id="out" class="warn">خروج من وضع الأدمن</button></div><p id="sum" class="muted"></p><p id="msg" class="note" hidden></p><div id="list"></div><button id="more" hidden>عرض المزيد</button></section><section id="denied" class="card" hidden><p>غير مصرّح. لازم تكون داخل التطبيق بحساب الأدمن من نفس المتصفح.</p><button id="back2">رجوع للتطبيق</button></section></main><script src="/admin.js?v=1.26.0"></script></body></html>
