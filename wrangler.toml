name = "locked-room"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Client ID مش سر. الـ Secret والـ SESSION_SECRET بيتحطوا بـ: wrangler secret put
[vars]
GOOGLE_CLIENT_ID = "875994009871-vn14ekp88f8c6d4qpm5h262he70rdj2a.apps.googleusercontent.com"
VAPID_PUBLIC_KEY = "BHG-O_OAJgQRm7llVtZqaHMXDVIF6eWcacPCY4w8YHWY4R210r_2hdTs3FYNLXjTd7y2JMsloFbz6rk7-trsBH0"
# إيميل الأدمن (جوجل). مش سر؛ صفحة /admin بتتفتح بس لو دخلت التطبيق بيه. التوكن ADMIN_TOKEN هو السر (wrangler secret put ADMIN_TOKEN).
ADMIN_EMAIL = "mm284817@gmail.com"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[durable_objects.bindings]]
name = "ROOM_PASSWORDS"
class_name = "RoomPasswords"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Account"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RoomPasswords"]